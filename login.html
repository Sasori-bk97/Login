<!DOCTYPE html>
<html lang="pt">

    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,
        initial-scale=1.0">

        <title>Login</title>

        <link rel="stylesheet"  href="CSS/fundo.CSS">
        <script src="JS/funcao.JS" defer></script>

    </head>

    <body>

        

        <div class="login">

            <div class="neon"></div>

            <div class="card" id="card">

                <form class="interface">

                    <h2>Bem Vindo</h2>
                    <p>Entre com seu Login, por favor</p>

                    <input type="email" placeholder="E-mail"><br><br>
                    <input type="password" placeholder="Senha"><br><br>
                    
                    <div class="opcoes">

                        <label><input type="checkbox">Lembre-me!</label>
                        <a href="#" >Esqueceu a senha?</a><br><br>

                    </div>

                    <button type="button">ENTRAR</button>

                    <p>Não tem cadastro?
                        <a class="ir-cadastro" href="#">Cadastr-se</Cadastr-se></a></p>

                </form>

                <form class="interface interface_virada">

                    <h2>Cadastro</h2>
                    <p>Crie sua conta, por favor</p>

                    <input type="text" placeholder="Nome"><br><br>
                    <input type="date" placeholder="Data de nascimento"><br><br>
                    <input type="email" placeholder="E-mail"><br><br>
                    <input type="password" placeholder="Senha"><br><br>

                    <button type="button">CADASTRAR</button>

                    <p>Eu já tem uma conta?
                        <a class="ir-login" href="#">Já tenho uma conta</a></p>

                </form>
            
            </div>

        </div>

    </body>

</html>
